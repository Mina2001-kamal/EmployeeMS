<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Update Employee</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="navbar">
    <a href="index.html">Home</a>
    <a href="add.html">Add Employee</a>
    <a href="view.html">View Employees</a>
    <a href="update.html">Update Employee</a>
    <a href="delete.html">Delete Employee</a>
    <a href="search.html">Search</a>
</nav>

<div class="container hero">
    <h1>Update Employee</h1>
    <p>Select the field and employee ID to update information.</p>
</div>

<form id="updateForm">
    <input type="number" id="id" placeholder="Employee ID">
    <select id="field">
        <option value="FullName">Full Name</option>
        <option value="JobTitle">Job Title</option>
        <option value="Department">Department</option>
        <option value="PhoneNumber">Phone Number</option>
        <option value="Salary">Salary</option>
    </select>
    <input type="text" id="newValue" placeholder="New Value">
    <button type="submit">Update Employee</button>
    <div class="alert" id="updateMsg"></div>
</form>

<script src="js/app.js"></script>
</body>
</html>
