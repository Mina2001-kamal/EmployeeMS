        <thead>
            <tr>
                <th>ID</th>
                <th>Full Name</th>
                <th>Job Title</th>
                <th>Department</th>
                <th>Salary</th>
                <th>Phone</th>

        </thead>
        <tbody>
            <!-- النتائج ستظهر هنا عند الربط بالـ Back-end -->
